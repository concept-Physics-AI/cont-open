# ConT Fab에서 고를 수 있는 물리 정보의 목록.
# 여기에는 지금 코드에 실제로 있는 엔진만 적는다. preview는 cont.fab.previews에 있는 함수 이름이며, 그 함수가 엔진을 돌려 샘플을 만든다.
# 상품(item) 하나 = 엔진 하나. 샘플 = 그 엔진을 어떤 조건으로 돌린 결과. samples에 조건을 적으면 그만큼 샘플이 만들어진다.
# sample_rule.yield_safety: 규격별 샘플의 조임 토크를 정할 때 쓰는 예시 목표 (추천 엔진이 이 목표를 만족하는 토크를 고른다). 판정 기준이 아니다.
# quantity: 물리 특성 (무엇에 대한 것인가). 진열대를 형태별로도, 물리 특성별로도 묶는다.
forms:
  image: 이미지
  graph: 그래프
  3d: 3D
  4d: 4D
  video: 영상
  signal: 신호
  number: 계산값
  judge: 판단 · 점검
items:
- key: fastening_shape
  name: 볼트 조인트 3D CAD
  form: 3d
  area: 체결
  quantity: 형상
  summary: 치수를 넣으면 형상이 만들어집니다. STEP · STL로 내려받습니다.
  needs: 치수, 강도 등급
  gives: 3D 형상, CAD 파일
  preview: fastening_section
  doc: docs/shape.md
  uses:
  - 설계할 때
  - 보고할 때
  limits: 볼트 조인트 하나의 형상입니다. 나사산은 그리지 않습니다.
  together:
  - fastening_drawing
  - fastening_hidden
  samples:
    sizes:
    - M6
    - M8
    - M10
    - M12
    - M16
    - M20
    - M24
- key: fastening_hidden
  name: 숨은 물리 3D
  form: 3d
  area: 체결
  quantity: 응력 · 압력
  summary: 판을 비쳐 보이게 하고, 눌리는 영역과 볼트의 응력을 색으로 보입니다.
  needs: 조인트, 조임 토크
  gives: 눌리는 영역, 볼트의 응력 ÷ 항복강도
  preview: fastening_hidden
  doc: docs/hidden_physics.md
  uses:
  - 설계할 때
  - 보고할 때
  limits: 눌리는 영역은 계산 모형의 모양이며 관측한 것이 아닙니다.
  together:
  - fastening_field
  - fastening_process
  samples:
    sizes: &id001
    - M8
    - M10
    - M12
    - M16
    - M20
- key: fastening_drawing
  name: 단면도
  form: image
  area: 체결
  quantity: 형상
  summary: 조인트의 단면을 치수와 함께 그립니다.
  needs: 치수
  gives: 단면 그림, 주요 치수
  preview: fastening_drawing
  doc: docs/shape.md
  uses:
  - 설계할 때
  - 보고할 때
  limits: 주요 치수만 적습니다.
  together:
  - fastening_shape
  samples:
    sizes: *id001
- key: fastening_field
  name: 축 방향 압축 응력 분포
  form: image
  area: 체결
  quantity: 응력 · 압력
  summary: 판 안에서 압축이 퍼지는 모습을 수치해석으로 그립니다.
  needs: 조인트, 조임 토크
  gives: 물리 이미지, 판 사이 면의 압력
  preview: fastening_field
  doc: docs/fastening_field.md
  uses:
  - 설계할 때
  - 조건 잡을 때
  limits: 볼트는 풀지 않고 좌면에 고른 압력을 건 계산입니다. 두 판은 붙어 있다고 봅니다.
  together:
  - field_mises
  - interface_pressure
  field: plate_axial_compression
  samples:
    sizes: &id002
    - M10
    - M16
- key: field_mises
  name: 등가응력 분포
  form: image
  area: 체결
  quantity: 응력 · 압력
  summary: 판의 등가응력(von Mises)이 어디에 몰리는지 그립니다.
  needs: 조인트, 조임 토크
  gives: 물리 이미지, 최댓값
  preview: fastening_field
  doc: docs/fastening_field.md
  uses:
  - 설계할 때
  limits: 볼트는 풀지 않고 좌면에 고른 압력을 건 계산입니다. 두 판은 붙어 있다고 봅니다.
  together:
  - fastening_field
  - field_shear
  field: plate_von_mises
  samples:
    sizes: *id002
- key: field_radial
  name: 반지름 방향 응력 분포
  form: image
  area: 체결
  quantity: 응력 · 압력
  summary: 판이 반지름 방향으로 눌리고 당겨지는 곳을 그립니다.
  needs: 조인트, 조임 토크
  gives: 물리 이미지, 최댓값
  preview: fastening_field
  doc: docs/fastening_field.md
  uses:
  - 설계할 때
  limits: 볼트는 풀지 않고 좌면에 고른 압력을 건 계산입니다. 두 판은 붙어 있다고 봅니다.
  together:
  - fastening_field
  field: plate_radial_compression
  samples:
    sizes: *id002
- key: field_shear
  name: 전단 응력 분포
  form: image
  area: 체결
  quantity: 응력 · 압력
  summary: 좌면 가장자리 아래에서 전단 응력이 생기는 띠를 그립니다.
  needs: 조인트, 조임 토크
  gives: 물리 이미지, 최댓값
  preview: fastening_field
  doc: docs/fastening_field.md
  uses:
  - 설계할 때
  limits: 볼트는 풀지 않고 좌면에 고른 압력을 건 계산입니다. 두 판은 붙어 있다고 봅니다.
  together:
  - field_mises
  field: plate_shear
  samples:
    sizes: *id002
- key: field_displacement
  name: 축 방향 변위 분포
  form: image
  area: 체결
  quantity: 변형 · 변위
  summary: 조였을 때 판이 축 방향으로 얼마나 움직이는지 그립니다.
  needs: 조인트, 조임 토크
  gives: 물리 이미지, 최댓값
  preview: fastening_field
  doc: docs/fastening_field.md
  uses:
  - 설계할 때
  - 조건 잡을 때
  limits: 볼트는 풀지 않고 좌면에 고른 압력을 건 계산입니다. 두 판은 붙어 있다고 봅니다.
  together:
  - fastening_estimate
  field: plate_axial_displacement
  samples:
    sizes: *id002
- key: interface_pressure
  name: 판 사이 면의 압력
  form: graph
  area: 체결
  quantity: 응력 · 압력
  summary: 두 판이 맞닿은 면에서 압력이 반지름에 따라 어떻게 줄어드는지 그립니다.
  needs: 조인트, 조임 토크
  gives: 반지름-압력 그래프, 눌리는 반지름
  preview: interface_pressure
  doc: docs/fastening_field.md
  uses:
  - 설계할 때
  limits: 볼트는 풀지 않고 좌면에 고른 압력을 건 계산입니다. 두 판은 붙어 있다고 봅니다.
  together:
  - fastening_field
  samples:
    sizes: *id001
- key: fastening_diagram
  name: 체결 선도
  form: graph
  area: 체결
  quantity: 힘 · 체결력
  summary: 볼트와 판이 힘을 나눠 받는 모습을 그립니다.
  needs: 조인트, 하중
  gives: 체결 선도
  preview: fastening_diagram
  doc: docs/fastening_screen.md
  uses:
  - 설계할 때
  limits: 동심 체결과 동심 하중, 판 두 장, 열 하중 없음.
  together:
  - fastening_safety
  samples:
    sizes: *id001
- key: fastening_torque
  name: 토크와 체결력
  form: graph
  area: 체결
  quantity: 힘 · 체결력
  summary: 조임 토크에 따라 체결력이 어떻게 달라지는지, 마찰에 따른 폭과 함께 그립니다.
  needs: 조인트, 마찰 범위
  gives: 토크-체결력 그래프
  preview: fastening_torque
  doc: docs/fastening_screen.md
  uses:
  - 조건 잡을 때
  limits: 마찰계수의 범위는 넣은 값입니다. 실제 흩어짐은 재서 확인해야 합니다.
  together:
  - fastening_sensing
  samples:
    sizes: *id001
- key: fastening_safety
  name: 안전율 막대
  form: graph
  area: 체결
  quantity: 힘 · 체결력
  summary: 항복, 벌어짐, 미끄럼, 면압, 피로의 안전율을 한눈에 봅니다.
  needs: 조인트, 하중
  gives: 안전율 여섯 가지
  preview: fastening_safety
  doc: docs/fastening_screen.md
  uses:
  - 설계할 때
  - 보고할 때
  limits: 값만 보입니다. 1.0은 경계이며 합격 기준이 아닙니다.
  together:
  - fastening_diagram
  samples:
    sizes: *id001
- key: fastening_process
  name: 조이는 과정
  form: 4d
  area: 체결
  quantity: 힘 · 체결력
  summary: 토크를 0에서 지금 값까지 나눠 다시 계산해 재생합니다.
  needs: 조인트, 조임 토크
  gives: 4D 재생, 토크마다의 체결력
  preview: fastening_process
  doc: docs/fastening_screen.md
  uses:
  - 조건 잡을 때
  - 보고할 때
  limits: 시간에 따른 거동의 해석이 아닙니다. 조이는 동안의 마찰 변화나 풀림은 담지 않습니다.
  together:
  - fastening_video
  - fastening_sensing
  samples:
    sizes: *id001
  preview_note: 재생은 체결 화면에서 봅니다. 미리보기는 그 장면들입니다.
- key: fastening_video
  name: 조이는 과정 영상
  form: video
  area: 체결
  quantity: 힘 · 체결력
  summary: 조이는 과정의 재생을 글자와 함께 영상으로 내려받습니다.
  needs: 조인트, 조임 토크
  gives: 영상 파일 (1280 × 720)
  preview: fastening_video
  doc: docs/fastening_screen.md
  uses:
  - 보고할 때
  limits: 브라우저가 녹화 기능을 지원해야 합니다.
  together:
  - fastening_process
  samples:
    sizes: *id002
  preview_note: 영상은 체결 화면에서 브라우저가 만듭니다. 미리보기는 처음과 끝 장면입니다.
- key: fastening_estimate
  name: 늘어남에서 체결력 추정
  form: number
  area: 체결
  quantity: 변형 · 변위
  summary: 볼트의 늘어남을 재서 체결력과 마찰계수를 거꾸로 구합니다.
  needs: 볼트 늘어남 관측값
  gives: 추정 체결력과 범위, 추정 마찰계수
  preview: fastening_estimate
  doc: docs/fastening_estimate.md
  uses:
  - 조건 잡을 때
  - 감시할 때
  limits: 합성 관측으로만 확인했습니다. 볼트가 항복했거나 온도가 달라지면 맞지 않습니다.
  together:
  - fastening_sensing
  - field_displacement
  samples:
    sizes: *id002
  example:
    true_friction: 0.11
    noise_um: 2.0
    instrument_um: 2.0
    count: 5
- key: fastening_sensing
  name: 센서와 연결 추천
  form: judge
  area: 체결
  quantity: 계측
  summary: 이 조인트에서 무엇으로 재야 하는지, 신호가 얼마나 나오는지.
  needs: 조인트, 조임 토크
  gives: 단계별 센서, 연결 순서, 신호의 크기
  preview: fastening_sensing
  doc: docs/fastening_sensing.md
  uses:
  - 감시할 때
  - 조건 잡을 때
  limits: 센서의 종류와 연결 순서를 권하는 것이며, 제품 이름이나 가격은 다루지 않습니다.
  together:
  - fastening_estimate
  samples:
    sizes:
    - M8
    - M10
    - M16
- key: signal_drive
  name: 구동계 신호
  form: signal
  area: 설비 공통
  quantity: 전류 · 진동
  summary: 전류, 진동, 구동부 온도를 같은 운전조건의 평소와 비교합니다.
  needs: 구동계 신호, 부하 · 속도
  gives: 벗어난 구간, 벗어난 정도
  preview: signal_module
  doc: docs/diagnosis.md
  uses:
  - 감시할 때
  limits: 정상 운전 데이터가 있어야 합니다. 벗어난 정도만 보고합니다.
  together:
  - guidance
  - trend
  module: drive
- key: signal_pressure
  name: 압력 · 유동계 신호
  form: signal
  area: 설비 공통
  quantity: 압력 · 유량
  summary: 압력, 유량, 차압을 같은 운전조건의 평소와 비교합니다.
  needs: 압력 · 유량 신호, 설정값
  gives: 벗어난 구간, 벗어난 정도
  preview: signal_module
  doc: docs/diagnosis.md
  uses:
  - 감시할 때
  limits: 정상 운전 데이터가 있어야 합니다. 벗어난 정도만 보고합니다.
  together:
  - guidance
  - trend
  module: pressure_flow
- key: signal_thermal
  name: 열관리계 신호
  form: signal
  area: 설비 공통
  quantity: 온도
  summary: 온도 추종 오차, 히터 출력, 냉각수 온도차를 평소와 비교합니다.
  needs: 온도 신호, 설정 온도
  gives: 벗어난 구간, 벗어난 정도
  preview: signal_module
  doc: docs/diagnosis.md
  uses:
  - 감시할 때
  limits: 정상 운전 데이터가 있어야 합니다. 벗어난 정도만 보고합니다.
  together:
  - guidance
  module: thermal
- key: signal_cycle
  name: 동작 사이클 신호
  form: signal
  area: 설비 공통
  quantity: 시간 · 사이클
  summary: 사이클 시간, 구간 동작 시간, 최대 부하, 정지 위치 오차를 평소와 비교합니다.
  needs: 사이클별 기록
  gives: 벗어난 사이클, 벗어난 정도
  preview: signal_module
  doc: docs/diagnosis.md
  uses:
  - 감시할 때
  limits: 정상 운전 데이터가 있어야 합니다. 벗어난 정도만 보고합니다.
  together:
  - guidance
  - trend
  module: cycle
- key: trend
  name: 상태 추이
  form: graph
  area: 설비 공통
  quantity: 시간 · 사이클
  summary: 계통마다 벗어나 있던 시간이 뒤로 갈수록 늘어나는지 줄어드는지 봅니다.
  needs: 진단 결과
  gives: 계통 × 구간 토막의 추이
  preview: trend_heat
  doc: docs/diagnosis.md
  uses:
  - 감시할 때
  - 보고할 때
  limits: 토막의 수와 기준은 설정값입니다.
  together:
  - guidance
- key: guidance
  name: 원인 후보와 점검 안내
  form: judge
  area: 설비 공통
  quantity: 점검
  summary: 찾아낸 변화를 관찰 사실, 원인 후보, 다음 점검으로 정리합니다.
  needs: 진단 결과
  gives: 관찰 사실, 원인 후보, 다음 점검
