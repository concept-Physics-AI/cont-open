# ConT FAB 표현 유형 (진열대에서 고를 수 있어야 하는 결과의 종류).
# 상품(catalog.yaml)은 지금 코드에 엔진이 있는 것이고, 이 파일은 "무엇을 보여 줄 수 있어야 하는가"의 목록이다.
# 엔진이 없는 유형(covered_by가 없는 것)은 진열대에서 "준비 중 · 엔진 없음" 카드로 보이고, 결과처럼 보이는 그림이나 숫자를 만들지 않는다.
# covered_by가 있는 유형은 지금 그 상품으로 (체결 사례에 한해) 되는 것이다. 상품 키는 catalog.yaml의 key.
# 자리: 유형 이름은 "응력 이미지 1"이 아니라 결과가 바로 보이는 이름으로 붙인다.
engines:
  thermal: {name: 열 해석, summary: 열전도·대류·열응력으로 온도와 열유속을 계산하는 엔진}
  structural: {name: 구조 해석 확장, summary: 임의 형상에서 응력·변형을 계산하는 엔진 (지금은 축대칭 판 하나)}
  contact: {name: 접촉응력 해석, summary: 맞닿은 면의 접촉 압력과 미끄럼을 계산하는 엔진}
  flow: {name: 유동 해석, summary: 유체의 속도·압력과 흐름 경로를 계산하는 엔진}
  modal: {name: 진동 모드 해석, summary: 고유진동수와 모드 형상을 계산하는 엔진}
  transient: {name: 시간 영역 해석, summary: 하중·열·유체가 시간에 따라 변하는 과정을 계산하는 엔진}
  cad: {name: 형상 생성 확장, summary: 부품·조립체·배관을 치수로 만드는 엔진 (지금은 볼트 조인트 하나)}
  scan: {name: 실측 형상 처리, summary: 스캔 메시·점군을 읽고 기준 형상과 비교하는 엔진}
  photo: {name: 사진 위치 대응, summary: 설비 사진 위에 측정 위치와 계산 영역을 맞추는 기능}
  signal: {name: 신호 분석, summary: 파형을 주파수와 시간–주파수로 나누고 통계를 내는 엔진}
  motion: {name: 로봇·기구 운동 해석, summary: 로봇 궤적과 기구 동작, 도달 범위를 계산하는 엔진}
  process: {name: 가공·성형 과정 해석, summary: 공구 이동과 소재 제거, 성형 변화를 계산하는 엔진}
  layout: {name: 설비 배치 모델, summary: 설비와 센서의 위치 관계를 담는 모델}
  video: {name: 결과 영상 만들기, summary: 계산 결과와 현장 영상을 구간·자막과 함께 영상으로 묶는 기능}
  knowledge: {name: 점검 지식표 확장, summary: 이상 징후에 맞는 점검·보류 근거를 담은 지식표 (지금은 가상 설비 몇 가지)}
  calc: {name: 계산식 엔진 확장, summary: 열량·압력손실 같은 값을 입력 조건에서 계산하는 엔진}
