# Studio가 질문의 물리 영역을 알아보는 단어. 체결 세션으로 이어 가는 영역(chat: true)은 체결 하나다. handler가 있는 영역은 그 대화 모듈이 따로 답한다 (열).
# 영역을 새로 열 때는 키워드를 더하고 chat을 true로 바꾼다. 맞는 영역이 없으면 추측하지 않고 지금 하던 대화를 이어 간다.
areas:
- key: fastening
  name: 체결
  chat: true
  keywords: [체결, 볼트, 너트, 토크, 조임, 조이, 마찰, 안전율, 판, 체결력, 풀림, 항복, 나사, 스크류, M6, M8, M10, M12, M16, M20]
- key: machining
  name: 절삭가공
  chat: false
  keywords: [절삭, 선삭, 가공, 절입, 이송, 공구, 칩, 표면 거칠기, 절삭력, 선반, 밀링]
  note: 계산 뼈대만 있다 (선삭의 절삭력, 동력, 표면 거칠기). 대화 화면은 아직 없다
- key: diagnosis
  name: 설비 이상진단
  chat: false
  keywords: [진단, 이상진단, 이상 징후, 진동, 베어링, 설비, 스펙트럼, 주파수, 모터, 펌프, 고장]
  note: 진단 화면은 FAB으로 만든 화면의 한 예로 따로 있다. Studio 대화에는 아직 연결하지 않았다
- key: heat
  name: 열 (열전도)
  chat: false
  handler: heat
  keywords: [열전도, 열확산, 2차원, 열해석, 온도 분포, 온도 변화, 식히, 식는, 냉각, 가열, 방열, 열전달, 확산계수]
  note: 해석해가 있는 기준 문제의 가상 계산만 된다
