# 두 번째 보지 않은 사례 모음. scene_eval.yaml, scene_eval_unseen.yaml과 문장이 겹치지 않게 새로 썼다.
# 앞선 측정에서 실패한 유형(한국어 항목명 → 필드 이름, 되돌리기 요청)을 고친 뒤, 그 고침을 보지 않은 문장으로 확인하는 용도다.
# 사용: python -m cont.dialogue.scene_eval --cases config/dialogue/scene_eval_unseen2.yaml
repeat: 3
timeout_s: 300
llm_opts: {temperature: 0}

cases:
  # --- 항목 이름 대응 (고친 유형) ---
  - id: v_inner_radius
    turns: ["위 유전층을 선택해서 안쪽 반지름을 2로 해줘"]
    expect: {parts: {die.dielectric: {inner: 2}}, selection: [die.dielectric]}
  - id: v_bottom_face
    turns: ["아래 유전층 선택하고 아랫면 높이를 0.9로 낮춰줘"]
    expect: {parts: {wafer.dielectric: {z0: 0.9}}, selection: [wafer.dielectric]}
  - id: v_rename
    turns: ["위 다이(실리콘)를 선택하고 이름을 '상부 다이'로 바꿔줘"]
    expect: {parts: {die.si: {name: 상부 다이}}, selection: [die.si]}
  - id: v_it_outer_radius
    turns: ["위 유전층을 선택해줘", "그 부품의 바깥 반지름을 15로 해줘"]
    expect: {parts: {die.dielectric: {outer: 15}}, selection: [die.dielectric]}
  - id: v_it_top_face
    turns: ["아래 웨이퍼(실리콘)를 선택해줘", "그걸 윗면 높이 1.1로 올려줘"]
    expect: {parts: {wafer.si: {z1: 1.1}}, selection: [wafer.si]}
  - id: v_edit_by_id
    turns: ["wafer.dielectric의 윗면 높이를 1.3으로 바꿔줘"]
    expect: {parts: {wafer.dielectric: {z1: 1.3}}, selection: [wafer.dielectric]}
  # --- 되돌리기·취소 (고친 유형) ---
  - id: v_undo_camera
    turns: ["카메라를 방위각 100도로 돌려줘", "취소해줘"]
    expect: {camera: {azimuth: 100}}
  - id: v_undo_edit
    turns: ["위 다이(실리콘)를 선택하고 윗면 높이를 2.4로 올려줘", "되돌려줘"]
    expect: {parts: {die.si: {z1: 2.4}}, selection: [die.si]}
  - id: v_undo_nothing
    turns: ["방금 한 걸 되돌려줘"]
    expect: {unchanged: true}
  - id: v_undo_with_value
    turns: ["정렬 단계를 0.5배로 해줘", "아니, 1배로 다시 해줘"]
    expect: {}
  # --- 정상 요청, 새 표현 ---
  - id: v_speed_slow_contact
    turns: ["접촉 단계만 0.2배로 아주 느리게"]
    expect: {speed: {contact: 0.2}}
  - id: v_speed_two_stages
    turns: ["접근 단계는 3배, 정렬 단계는 0.5배로 해줘"]
    expect: {speed: {approach: 3.0, align: 0.5}}
  - id: v_speed_second_ordinal
    turns: ["2번째 단계 속도를 2배로"]
    expect: {speed: {align: 2.0}}
  - id: v_camera_negative_azimuth
    turns: ["방위각을 -60도로 돌려줘"]
    expect: {camera: {azimuth: -60}}
  - id: v_camera_elevation_distance
    turns: ["고도 50도, 거리 0.8로 맞춰줘"]
    expect: {camera: {elevation: 50, distance: 0.8}}
  - id: v_seek_zero
    turns: ["처음으로 돌아가 재생 위치를 0초로 해줘"]
    expect: {}
  - id: v_seek_four
    turns: ["4초 위치를 보여줘"]
    expect: {playback_t: 4.0}
  - id: v_image_contact_seed
    turns: ["접촉 단계 이미지를 시드 7로 만들어줘"]
    expect: {images: 1}
  - id: v_image_whole
    turns: ["지금 구조 전체 설명 이미지를 만들어줘"]
    expect: {images: 1}
  - id: v_select_then_image
    turns: ["위 유전층을 선택해줘", "정렬 단계 이미지도 만들어줘"]
    expect: {selection: [die.dielectric], images: 1}
  # --- 모호·지원 안 함·없는 대상 ---
  - id: v_amb_dielectric_inner
    turns: ["유전층의 안쪽 반지름을 3으로 해줘"]
    expect: {unchanged: true}
  - id: v_amb_wafer_side
    turns: ["웨이퍼 쪽 부품의 윗면 높이를 1.5로 해줘"]
    expect: {unchanged: true}
  - id: v_amb_both_stages
    turns: ["앞의 두 단계를 느리게 해줘"]
    expect: {unchanged: true}
  - id: v_unknown_field
    turns: ["위 다이(실리콘)의 열전도율을 바꿔줘"]
    expect: {unchanged: true}
  - id: v_unknown_part_cu
    turns: ["구리 패드의 바깥 반지름을 5로 해줘"]
    expect: {unchanged: true}
  - id: v_missing_value_camera
    turns: ["카메라를 더 가까이 가져와줘"]
    expect: {unchanged: true}
  - id: v_question
    turns: ["단계가 몇 개야?"]
    expect: {unchanged: true}
