# LLM providers. Keys are NEVER written here - only the name of the env var that holds them.
# Personal/extra entries: providers.local.yaml (same format, not in git).
# Pick one: CONT_LLM_PROVIDER=<name>   (otherwise 'default' below)
default: ollama_local

providers:
  # --- in-house / local models (RTX 5080 16GB, Ollama) ---
  ollama_local:
    type: openai_compatible
    base_url: http://127.0.0.1:11434/v1
    model: gpt-oss:20b
  ollama_vision:
    type: openai_compatible
    base_url: http://127.0.0.1:11434/v1
    model: qwen3-vl:8b
  mpai_local:
    type: openai_compatible
    base_url: http://127.0.0.1:11434/v1
    model: mpai-gpt-oss-20b

  # --- external APIs ---
  openai:
    type: openai_compatible
    base_url: https://api.openai.com/v1
    model: gpt-4.1
    api_key_env: OPENAI_API_KEY
  anthropic:
    type: anthropic
    model: claude-sonnet-5-5
    api_key_env: ANTHROPIC_API_KEY
  gemini:
    type: gemini
    model: gemini-2.5-pro
    api_key_env: GEMINI_API_KEY
  openrouter:
    type: openai_compatible
    base_url: https://openrouter.ai/api/v1
    model: openai/gpt-4.1
    api_key_env: OPENROUTER_API_KEY

  # --- offline stand-in for tests ---
  echo:
    type: echo
    model: echo
