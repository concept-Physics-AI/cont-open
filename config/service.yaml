# 서비스 층 설정. 주소는 이 컴퓨터(127.0.0.1)로 고정이며 바꾸지 못한다. 환경 변수 CONT_SERVICE_PORT가 port를 덮어쓴다.
port: 8770
max_body_bytes: 1048576
# 실행 저장 위치. 비워 두면 저장하지 않는다. 환경 변수 CONT_RUN_DIR이 덮어쓴다. 저장소 안에 두지 않는다.
run_dir: ""
# 자료 장부(원본·파생물의 지문과 부모 관계) 위치. 비워 두면 근거 자료를 쓰는 실행은 거절된다. 환경 변수 CONT_LEDGER_DIR이 덮어쓴다. 저장소 안에 두지 않는다.
ledger_dir: ""
