- key: product_fab
  name: ConT Fab
  status: 뼈대
  scope: 고르기와 기본 구성기 있음 (조건·크기·순서 설정, 브라우저 저장과 파일 재열기). 현장 신호 연결은 기록만. 서버로 띄우고 실행 저장소(CONT_RUN_DIR)를 켜면 만든 결과가 실행 ID로 남고 다시 열 때 읽힘 (실제 브라우저 시험은 아직 없음). 시나리오, 공장 화면은 없음
