# 지금 무엇이 있고 무엇이 없는가 (상태 한 곳). 상태는 있음 · 뼈대 · 없음 가운데 하나.
# "있음"은 동작하고 시험했다는 뜻이며 물리적으로 검증됐다는 뜻이 아니다. 범위는 scope에 적는다.
# 없는 것을 있는 것처럼 적지 않는다: 있음·뼈대는 evidence(실제 파일)가 있어야 하고, 없음은 evidence가 없어야 한다.
