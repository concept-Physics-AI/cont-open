# Physics 화면에 "지금 있는 엔진"으로 보일 목록. 코드에 실제로 있는 것만 적는다 (tests가 팩 이름과 맞는지 확인한다).
# 물리 값은 이 엔진들만 낸다. 값은 계산값이며 실측 검증 전이다.
engines:
- key: fastening
  pack: true
  name: 체결 (볼트 조인트)
  summary: 볼트·너트와 판 두 장의 체결력, 눌림, 응력 분포를 계산합니다 (VDI 2230 식 + 축대칭 유한요소)
  limits: 볼트 조인트 하나만 됩니다. 접촉 분리·미끄럼, 소성은 담지 않았습니다
- key: machining
  pack: true
  name: 절삭가공 (선삭)
  summary: 선삭의 절삭력, 동력, 표면 거칠기를 계산합니다 (키엔츨레 식)
  limits: 선삭 하나만 됩니다. 공구 마모와 진동은 담지 않았습니다
- key: diagnosis
  pack: true
  name: 설비 공통 이상진단
  summary: 구동계, 압력·유동계, 열관리계, 공정 사이클의 변화를 기준선과 비교해 관찰 사실과 점검 후보로 정리합니다
  limits: 가상 설비 데이터로만 시연했습니다. 원인은 후보이며 확정이 아닙니다
- key: fem_axisym
  pack: false
  name: 축대칭 유한요소
  summary: 축을 중심으로 돌린 모양의 선형 탄성 변위와 응력을 풉니다
  limits: 접촉, 소성, 큰 변형, 축대칭이 아닌 하중은 담지 않았습니다
- key: shape
  pack: false
  name: 형상 (치수 → 명세 → 메시)
  summary: 치수에서 부품·조립체 명세를 만들고 화면용 메시를 만듭니다
  limits: 볼트 조인트 형상 중심이며 CAD 파일(STEP) 출력은 뒤에 붙입니다
