# 적층 1D 열응답 기준 (Y6)의 지원 범위. 이 밖의 입력은 계산하지 않고 이유를 알린다. 단위는 SI (m, s, K, W).
# 범위는 단위 착오(섭씨와 켈빈, mm와 m)를 걸러내기 위한 넓은 울타리이지 정확도 보증 범위가 아니다.
max_layers: 8
bounds:
  thickness_m: [1.0e-9, 0.1]
  conductivity_w_mk: [0.01, 1000.0]
  density_kg_m3: [100.0, 25000.0]
  specific_heat_j_kgk: [100.0, 5000.0]
  interface_resistance_m2k_w: [0.0, 0.01]
  h_conv_w_m2k: [0.1, 100000.0]
  temperature_k: [200.0, 1500.0]
  duration_s: [1.0e-6, 100000.0]
grid:
  cells_per_layer_min: 6
  cells_total_default: 120
  cells_total_max: 1000
  steps_default: 200
  steps_max: 4000
