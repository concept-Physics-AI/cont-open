# 공통 진단 모듈: 공정 동작·사이클 (반복 동작). 표본 하나가 사이클 한 번이다.
# 입력은 사이클마다 한 줄로 요약한 값(사이클 시간, 구간 시간, 최대 부하 등)이다.
module: cycle
title: 공정 동작·사이클
keywords: [사이클, 동작, 택트, 반복]   # 질문에서 이 계통을 가리키는 말 (대화용)
roles:
  cycle_time:     {label: 사이클 시간, unit: s}
  step_time:      {label: 구간 동작 시간, unit: s}
  peak_load:      {label: 사이클 최대 부하, unit: ""}
  energy:         {label: 사이클 에너지, unit: ""}
  position_error: {label: 정지 위치 편차, unit: mm}
conditions:
  speed_setting: {label: 설정 속도}
  load:          {label: 처리 부하}
change_types:
  - {role: cycle_time,     direction: up,   key: cycle_slowdown,        label: "사이클 지연 (같은 조건에서 사이클 시간 증가)"}
  - {role: cycle_time,     direction: down, key: cycle_shortening,      label: "사이클 단축 (같은 조건에서 사이클 시간 감소)"}
  - {role: step_time,      direction: up,   key: step_delay,            label: "구간 동작 지연"}
  - {role: step_time,      direction: down, key: step_shortening,       label: "구간 동작 단축"}
  - {role: peak_load,      direction: up,   key: peak_load_increase,    label: "사이클 최대 부하 증가"}
  - {role: peak_load,      direction: down, key: peak_load_decrease,    label: "사이클 최대 부하 감소"}
  - {role: energy,         direction: up,   key: energy_increase,       label: "사이클 에너지 증가"}
  - {role: position_error, direction: up,   key: repeatability_decline, label: "반복 정밀도 저하 (정지 위치 편차 확대)"}
