  - 기능 상태표와 미지원 범위 갱신
  acceptance:
  - 실제로 인수한 범위만 상태 변경
  - 병합 후 실제 실행 커밋 확인; 설치 환경별 미실행 항목 공개
  - 다른 작업자의 변경을 보존하고 동일 파일 충돌을 해결
  negative_tests:
  - 이전 커밋의 화면 녹화만으로 최신 릴리스 인수 처리하지 않음
