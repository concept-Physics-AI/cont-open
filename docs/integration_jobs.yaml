schema_version: 2
kind: development_plan_not_runtime_state
baseline_commit: cd7a63ce705fa0553e2e0682fb8d7a8205638b32
decision: 생성형 최우선 · PINN 자체 모형 SW를 학습 없이 병행 구현 · 모형 학습과 대규모 현장 학습은 후속
definition_authority: docs/integration_jobs.yaml
process_authority: docs/integration_control_plan.md
notes:
- 기존 코드가 있다는 사실과 이 통합 작업의 인수 완료는 다르다. 모든 작업은 이번 계획의 미착수 정의다.
- 담당자는 아직 배정하지 않았다. owner_role은 필요한 역할이며 실제 인원 수나 담당자 지정이 아니다.
- 이 파일만으로 작업을 실행하거나 상태를 자동 변경하는 코드는 아직 없다.
- depends_on은 해당 작업의 통합 인수 선행조건이다. 인터페이스 초안/독립 구현 준비는 먼저 할 수 있으나 더미 시험을 인수로 계산하지 않는다.
- '2026-11-25 후속 지시: 현재 PINN 작업의 인수는 새 학습 실행이나 학습된 가중치 없이 통과해야 한다. 기준 해석기와 신경망 구조/잔차 연산 시험을 구분한다.'
- 정적 계획 검사기는 정의의 정합성만 검사한다. 담당 배정·작업 실행·실제 모형 인수·자동 학습을 수행하지 않는다.
jobs:
- id: CT01
  title: 기준 코드·재사용 자산·미완료 연결 확정
  track: control
  owner_role: 통합 책임
  owner: null
  planning_state: planned
  depends_on: []
  reuse_paths:
  - config/status.yaml
  - config/authority.yaml
  - docs/models.md
  deliverables:
  - 기준 커밋에 고정한 기능/코드/시험/실행 증거 대조표
  - 중복 모듈·문서 불일치 목록과 수정 범위
  acceptance:
  - 계획·코드 존재·시험 통과·실제 모델 실행·제품 인수를 서로 다른 칸으로 기록
  - 'PR #100의 본딩 장면을 포함한 최신 구현을 반영하되 전체 생성 완료로 올리지 않음'
  negative_tests:
  - 파일 존재만으로 실제 생성 완료를 표기한 항목을 검토에서 반려
  rollback: 이전 기준 스냅샷 보존; 코드나 보관 자산 삭제 없음
  evidence_required:
  - 검사한 코드 커밋과 실행 환경
  - 입력·조건·모델/설정 버전
  - 실행 명령 또는 화면 조작 순서
  - 실제 출력과 로그·시험 결과
  - 미실행·건너뜀·남은 문제
  core_objectives:
  - C1
  - C2
  - C3
  - C4
  - C5
  - C6
  model_refs: []
  new_training_required: false
  entry_requirements:
  - 기준 커밋과 변경 파일 범위를 고정하고 실제 담당·브랜치를 기록
  - 선행 작업의 필요한 계약·증거를 확인; 미충족이면 독립 설계 범위와 차단 사유를 기록
  - 이 작업이 연결하는 핵심 사용자 동작과 실패 시험을 먼저 확인
  implementation_steps:
  - id: CT01.01
    action: 기준 커밋과 미병합 변경을 조사한다
    output: 기준 SHA·범위·충돌 후보 표
    check: main과 작업 트리의 차이를 기록
  - id: CT01.02
    action: 여섯 능력의 기존 모듈과 시험을 대조한다
    output: 기능-코드-시험-실행 증거 표
    check: 파일 존재와 실행 인수를 분리
  - id: CT01.03
    action: 최근 ObjectSpec 이미지·선택·프로젝트 저장 코드와 SDXL 실제 생성 기록을 상태표에 반영한다
    output: 현황 정정 diff
    check: 전체 제품 완료로 올리지 않음
  - id: CT01.04
    action: 실행 환경과 우선 차단 요인을 정리한다
    output: GF01/GF02/PF01 착수 입력
    check: 공급자 설정과 실제 가용성을 구분
  handoff_required:
  - 현재 커밋·PR·변경 파일·실행 환경
  - 실제 실행한 명령·시험 결과·미실행 인수·증거 위치
  - 다음 작업에 넘길 계약 개정·입출력 샘플·재현 명령·차단 해소 조건
- id: CT02
  title: 작업 등록·담당·브랜치·의존성 관리
  track: control
  owner_role: 통합 책임
  owner: null
  planning_state: planned
  depends_on:
  - CT01
  reuse_paths:
  - config/status.yaml
  - .github/pull_request_template.md
  deliverables:
  - 이 YAML을 읽는 작업 등록/조회/상태 전환 기능
  - 개발 작업 상태와 제품 실행 상태를 분리한 기록 형식
  acceptance:
  - 담당 미지정 작업은 ready/in_progress로 올리지 않음
  - 동일 파일 변경의 활성 작업을 표시하고 공통 계약 변경은 순서를 정함
  - 의존 작업 미인수 시 이유와 해소 조건 표시
  negative_tests:
  - 순환 의존·없는 작업 ID·중복 ID 거절
  - 같은 상태 버전의 동시 전환 중 한 건만 반영
  rollback: 기존 상태 기록과 전환 이력 보존; 상태를 덮어써 없애지 않음
  evidence_required:
  - 검사한 코드 커밋과 실행 환경
  - 입력·조건·모델/설정 버전
  - 실행 명령 또는 화면 조작 순서
  - 실제 출력과 로그·시험 결과
  - 미실행·건너뜀·남은 문제
  core_objectives:
  - C1
  - C2
  - C3
  - C4
  - C5
  - C6
  model_refs: []
  new_training_required: false
  entry_requirements:
  - 기준 커밋과 변경 파일 범위를 고정하고 실제 담당·브랜치를 기록
  - 선행 작업의 필요한 계약·증거를 확인; 미충족이면 독립 설계 범위와 차단 사유를 기록
  - 이 작업이 연결하는 핵심 사용자 동작과 실패 시험을 먼저 확인
  implementation_steps:
  - id: CT02.01
    action: 작업 정의와 상태 이력을 분리한다
    output: 작업 ID·owner·branch·상태 개정 계약
    check: 사용자 run_id와 혼용 없음
  - id: CT02.02
    action: 의존 DAG와 변경 경로를 조회한다
    output: 선행조건·동일 파일 충돌 목록
    check: 없는 ID·순환·중복 ID 거절
  - id: CT02.03
    action: 담당 선점과 상태 전환을 구현한다
    output: 단일 작성자와 원자적 개정 처리
    check: 같은 개정의 동시 변경 한 건만 성공
  - id: CT02.04
    action: 차단 해제·취소·재개를 연결한다
    output: 이유·담당·다음 행동·이력
    check: 미인수 의존 작업을 완료로 간주하지 않음
  handoff_required:
  - 현재 커밋·PR·변경 파일·실행 환경
  - 실제 실행한 명령·시험 결과·미실행 인수·증거 위치
  - 다음 작업에 넘길 계약 개정·입출력 샘플·재현 명령·차단 해소 조건
- id: CT03
  title: 완료 증거 등록·검사·단계별 인수
  track: control
  owner_role: 검증 책임
  owner: null
  planning_state: planned
  depends_on:
  - CT02
  reuse_paths:
  - tests/test_control_tower.py
  - src/cont/service/ledger.py
  deliverables:
  - 커밋·모델·환경·입력·출력 해시를 가진 증거 목록
  - 코드/실제 모델/화면/복구/물리 기준 시험의 분리 판정
  acceptance:
  - 시험용 응답 증거로 실제 모델 인수를 통과하지 못함
  - 참조 파일 누락·해시 불일치·다른 커밋의 증거는 재검토 표시
  - 물리 성능과 소프트웨어 성공을 분리
  negative_tests:
  - 위조 완료 표기·건너뛴 필수 시험·누락 산출물·만료된 증거를 차단
  rollback: 증거 정정은 새 개정으로 추가하고 원본 유지
  evidence_required:
  - 검사한 코드 커밋과 실행 환경
  - 입력·조건·모델/설정 버전
  - 실행 명령 또는 화면 조작 순서
  - 실제 출력과 로그·시험 결과
  - 미실행·건너뜀·남은 문제
  core_objectives:
  - C1
  - C2
  - C3
  - C4
  - C5
  - C6
  model_refs: []
  new_training_required: false
  entry_requirements:
  - 기준 커밋과 변경 파일 범위를 고정하고 실제 담당·브랜치를 기록
  - 선행 작업의 필요한 계약·증거를 확인; 미충족이면 독립 설계 범위와 차단 사유를 기록
  - 이 작업이 연결하는 핵심 사용자 동작과 실패 시험을 먼저 확인
  implementation_steps:
  - id: CT03.01
    action: 증거 종류와 귀속을 정의한다
    output: code/unit/provider/browser/restore/physics 구분
    check: 시험용 응답을 provider 증거로 거절
  - id: CT03.02
    action: 증거 파일과 입력·출력 해시를 등록한다
    output: 불변 증거 manifest
    check: 누락·다른 커밋·손상 파일 탐지
  - id: CT03.03
    action: 필수 인수 항목과 실행 결과를 대조한다
    output: pass/fail/skip/not_run 판정
    check: 필수 skip이 accepted를 만들지 않음
  - id: CT03.04
    action: 정정과 무효화 이력을 보존한다
    output: 부모 증거·재검사 대상
    check: 원본 삭제 없이 새 개정 추가
  handoff_required:
  - 현재 커밋·PR·변경 파일·실행 환경
  - 실제 실행한 명령·시험 결과·미실행 인수·증거 위치
  - 다음 작업에 넘길 계약 개정·입출력 샘플·재현 명령·차단 해소 조건
- id: CT04
  title: 진척·차단·실패·다음 작업 대시보드
  track: control
  owner_role: 제품 UI
  owner: null
  planning_state: planned
  depends_on:
  - CT02
  - CT03
  reuse_paths:
  - config/status.yaml
  - src/cont/view
  deliverables:
  - 작업/제품 기능/실제 실행 증거를 구분한 조회 화면
  - 차단 원인·다음 작업·담당·검사한 커밋 표시
  acceptance:
  - 전체 작업 수와 인수 완료 수를 별도로 표시하고 건너뜀은 완료에 포함하지 않음
  - 실제 생성 증거 없는 기능은 연결 시험 상태로 표시
  - 수동 새로고침으로 재현; 예약 실행이나 자동 알림을 새로 만들지 않음
  negative_tests:
  - 오래된 스냅샷을 최신으로 표시하지 않음
  - 권한 없는 실행 기록·비밀값 노출 차단
  rollback: 기존 상태 파일·PR로 추적 가능; 대시보드 장애가 개발을 막지 않음
  evidence_required:
  - 검사한 코드 커밋과 실행 환경
  - 입력·조건·모델/설정 버전
  - 실행 명령 또는 화면 조작 순서
  - 실제 출력과 로그·시험 결과
  - 미실행·건너뜀·남은 문제
  core_objectives:
  - C1
  - C2
  - C3
  - C4
  - C5
  - C6
  model_refs: []
  new_training_required: false
  entry_requirements:
  - 기준 커밋과 변경 파일 범위를 고정하고 실제 담당·브랜치를 기록
  - 선행 작업의 필요한 계약·증거를 확인; 미충족이면 독립 설계 범위와 차단 사유를 기록
  - 이 작업이 연결하는 핵심 사용자 동작과 실패 시험을 먼저 확인
  implementation_steps:
  - id: CT04.01
    action: 조회 데이터와 제품 상태를 구분한다
    output: 작업·제품·모형 준비의 별도 조회 모델
    check: 작업 수로 제품 완성률을 주장하지 않음
  - id: CT04.02
    action: 담당·차단·다음 작업을 표시한다
    output: 여섯 필수 정보 카드
    check: owner 미정과 의존 미충족 표시
  - id: CT04.03
    action: 증거에서 실행까지 이동한다
    output: 커밋·로그·출력 참조 링크
    check: 깨진 링크와 권한 없는 자료 차단
  - id: CT04.04
    action: 필터와 재접속을 시험한다
    output: 트랙·담당·상태별 조회
