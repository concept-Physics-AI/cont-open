schema_version: 1
kind: development_plan_not_runtime_state
baseline_commit: 27708280c15d4266068ec43b91947ce1c8a8af58
decision: 생성형 최우선 · 다양한 물리/숨은 물리/물리 잔차 PINN 병행 · 대규모 현장 학습 후속
definition_authority: docs/integration_jobs.yaml
process_authority: docs/integration_control_plan.md
notes:
- 기존 코드가 있다는 사실과 이 통합 작업의 인수 완료는 다르다. 모든 작업은 이번 계획의 미착수 정의다.
- 담당자는 아직 배정하지 않았다. owner_role은 필요한 역할이며 실제 인원 수나 담당자 지정이 아니다.
- 이 파일만으로 작업을 실행하거나 상태를 자동 변경하는 코드는 아직 없다.
- depends_on은 해당 작업의 통합 인수 선행조건이다. 인터페이스 초안/독립 구현 준비는 먼저 할 수 있으나 더미 시험을 인수로 계산하지 않는다.
jobs:
- id: CT01
  title: 기준 코드·재사용 자산·미완료 연결 확정
  track: control
  owner_role: 통합 책임
  owner: null
  planning_state: planned
  depends_on: []
  reuse_paths:
  - config/status.yaml
  - config/authority.yaml
  - docs/models.md
  deliverables:
  - 기준 커밋에 고정한 기능/코드/시험/실행 증거 대조표
  - 중복 모듈·문서 불일치 목록과 수정 범위
  acceptance:
  - 계획·코드 존재·시험 통과·실제 모델 실행·제품 인수를 서로 다른 칸으로 기록
  - 'PR #100의 본딩 장면을 포함한 최신 구현을 반영하되 전체 생성 완료로 올리지 않음'
  negative_tests:
  - 파일 존재만으로 실제 생성 완료를 표기한 항목을 검토에서 반려
  rollback: 이전 기준 스냅샷 보존; 코드나 보관 자산 삭제 없음
  evidence_required:
  - 검사한 코드 커밋과 실행 환경
  - 입력·조건·모델/설정 버전
  - 실행 명령 또는 화면 조작 순서
  - 실제 출력과 로그·시험 결과
  - 미실행·건너뜀·남은 문제
- id: CT02
  title: 작업 등록·담당·브랜치·의존성 관리
  track: control
  owner_role: 통합 책임
  owner: null
  planning_state: planned
  depends_on:
  - CT01
  reuse_paths:
  - config/status.yaml
  - .github/pull_request_template.md
  deliverables:
  - 이 YAML을 읽는 작업 등록/조회/상태 전환 기능
  - 개발 작업 상태와 제품 실행 상태를 분리한 기록 형식
  acceptance:
  - 담당 미지정 작업은 ready/in_progress로 올리지 않음
  - 동일 파일 변경의 활성 작업을 표시하고 공통 계약 변경은 순서를 정함
  - 의존 작업 미인수 시 이유와 해소 조건 표시
  negative_tests:
  - 순환 의존·없는 작업 ID·중복 ID 거절
  - 같은 상태 버전의 동시 전환 중 한 건만 반영
  rollback: 기존 상태 기록과 전환 이력 보존; 상태를 덮어써 없애지 않음
  evidence_required:
  - 검사한 코드 커밋과 실행 환경
  - 입력·조건·모델/설정 버전
  - 실행 명령 또는 화면 조작 순서
  - 실제 출력과 로그·시험 결과
  - 미실행·건너뜀·남은 문제
- id: CT03
  title: 완료 증거 등록·검사·단계별 인수
  track: control
  owner_role: 검증 책임
  owner: null
  planning_state: planned
  depends_on:
  - CT02
  reuse_paths:
  - tests/test_control_tower.py
  - src/cont/service/ledger.py
  deliverables:
  - 커밋·모델·환경·입력·출력 해시를 가진 증거 목록
  - 코드/실제 모델/화면/복구/물리 기준 시험의 분리 판정
  acceptance:
  - 시험용 응답 증거로 실제 모델 인수를 통과하지 못함
  - 참조 파일 누락·해시 불일치·다른 커밋의 증거는 재검토 표시
  - 물리 성능과 소프트웨어 성공을 분리
  negative_tests:
  - 위조 완료 표기·건너뛴 필수 시험·누락 산출물·만료된 증거를 차단
  rollback: 증거 정정은 새 개정으로 추가하고 원본 유지
  evidence_required:
  - 검사한 코드 커밋과 실행 환경
  - 입력·조건·모델/설정 버전
  - 실행 명령 또는 화면 조작 순서
  - 실제 출력과 로그·시험 결과
  - 미실행·건너뜀·남은 문제
- id: CT04
  title: 진척·차단·실패·다음 작업 대시보드
  track: control
  owner_role: 제품 UI
  owner: null
  planning_state: planned
  depends_on:
  - CT02
  - CT03
  reuse_paths:
  - config/status.yaml
  - src/cont/view
  deliverables:
  - 작업/제품 기능/실제 실행 증거를 구분한 조회 화면
  - 차단 원인·다음 작업·담당·검사한 커밋 표시
  acceptance:
  - 전체 작업 수와 인수 완료 수를 별도로 표시하고 건너뜀은 완료에 포함하지 않음
  - 실제 생성 증거 없는 기능은 연결 시험 상태로 표시
  - 수동 새로고침으로 재현; 예약 실행이나 자동 알림을 새로 만들지 않음
  negative_tests:
  - 오래된 스냅샷을 최신으로 표시하지 않음
  - 권한 없는 실행 기록·비밀값 노출 차단
  rollback: 기존 상태 파일·PR로 추적 가능; 대시보드 장애가 개발을 막지 않음
  evidence_required:
  - 검사한 코드 커밋과 실행 환경
  - 입력·조건·모델/설정 버전
  - 실행 명령 또는 화면 조작 순서
  - 실제 출력과 로그·시험 결과
  - 미실행·건너뜀·남은 문제
- id: CT05
  title: 시험 종류별 CI와 실제 실행 인수 분리
  track: control
  owner_role: 검증 책임
  owner: null
  planning_state: planned
  depends_on:
  - CT03
  reuse_paths:
  - .github/workflows/tests.yml
  - tests/test_generation.py
  - tests/test_scene4d.py
  - tests/learn
  deliverables:
  - 빠른 계약/회귀, 실제 공급자, 브라우저, PINN 기준 시험의 실행 프로파일
  - 필수 인수 시험이 skip이면 미인수로 남기는 보고
  acceptance:
  - PR의 오프라인 CI와 실제 모델 시험을 별도 집계
  - 비밀값이 필요한 실행은 허용된 환경에서 명시적으로 수행하고 로그에서 제거
  - 합성·더미 테스트는 실제 모델 성공률 분모에 섞지 않음
  negative_tests:
  - API 미설정·GPU 부족·브라우저/WebGL 미지원은 원인별 blocked 또는 skip이며 통과로 바꾸지 않음
  rollback: 기존 CI 유지; 새 실제 모델 작업은 선택 실행으로 시작
  evidence_required:
  - 검사한 코드 커밋과 실행 환경
  - 입력·조건·모델/설정 버전
  - 실행 명령 또는 화면 조작 순서
  - 실제 출력과 로그·시험 결과
  - 미실행·건너뜀·남은 문제
