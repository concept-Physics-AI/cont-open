schema_version: 1
kind: model_readiness_plan_not_runtime_registry
baseline_commit: cd7a63ce705fa0553e2e0682fb8d7a8205638b32
process_authority: docs/integration_control_plan.md
notes:
- 모형 능력 슬롯과 연산자 목록이다. 13개 독립 거대모형을 학습하는 계획이 아니다.
- runtime_acceptance는 이 제품 흐름에 대한 인수 상태다. 기존 연구·단위 시험의 존재를 부정하지 않는다.
- config_ref는 설정 위치 참조다. 공급자 설치·실행·편집 지원을 증명하지 않는다.
- 새 학습은 현재 필수가 아니며 자동 실행하지 않는다. 미학습 PINN 물리 값은 지원하는 기준 계산에서만 낸다.
